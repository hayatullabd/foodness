services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodness_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: foodness
      DB_USERNAME: hayatulla
      DB_PASSWORD: "@Nipa2005"
    ports:
      - "5173:5173"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - foodness_net

  webserver:
    image: nginx:latest
    container_name: foodness_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - foodness_net

  db:
    image: mysql:8.4
    container_name: foodness_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: foodness
      MYSQL_USER: hayatulla
      MYSQL_PASSWORD: "@Nipa2005"
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./foodness.sql:/docker-entrypoint-initdb.d/foodness.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - foodness_net

  # Optional: Uncomment if phpmyadmin is needed
  # phpmyadmin:
  #   image: phpmyadmin:latest
  #   container_name: foodness_phpmyadmin
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"
  #   environment:
  #     PMA_HOST: db
  #     PMA_PORT: 3306
  #     UPLOAD_LIMIT: 128M
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   networks:
  #     - foodness_net

networks:
  foodness_net:
    driver: bridge

volumes:
  dbdata:
    driver: local
